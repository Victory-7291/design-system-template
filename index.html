<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#18181b" />
    <title>Design System Starter Template</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>" />
    <script>
      (() => {
        const key = "theme";
        const darkThemeColor = "#18181b";
        const lightThemeColor = "#ffffff";
        try {
          const stored = window.localStorage.getItem(key);
          const prefersDark =
            typeof window.matchMedia === "function" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          const fallback = prefersDark ? "dark" : "light";
          const theme = stored === "light" || stored === "dark" ? stored : fallback;
          const isDark = theme === "dark";
          document.documentElement.classList.toggle("dark", isDark);
          document.documentElement.style.colorScheme = isDark ? "dark" : "light";
          const themeColorMeta = document.querySelector('meta[name="theme-color"]');
          if (themeColorMeta) {
            themeColorMeta.setAttribute("content", isDark ? darkThemeColor : lightThemeColor);
          }
        } catch {
          document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <section id="design-system-startup" role="status" aria-live="polite" hidden>
      <div class="mx-auto flex min-h-screen max-w-2xl flex-col justify-center space-y-4 px-4 py-10">
        <div>
          <h1 id="design-system-startup-title" class="text-lg font-semibold">Design System could not start</h1>
          <p id="design-system-startup-message" class="mt-1 text-sm text-muted-foreground">
            Part of the application failed to load. Check your connection or terminal and reload this page to try again.
          </p>
        </div>
        <div>
          <button id="design-system-startup-reload" type="button" class="inline-flex items-center rounded-md border border-input bg-background px-3 py-1.5 text-sm font-medium shadow-sm hover:bg-accent hover:text-accent-foreground">
            Reload page
          </button>
        </div>
      </div>
    </section>
    <script>
      (() => {
        const root = document.getElementById("root");
        const notice = document.getElementById("design-system-startup");
        const title = document.getElementById("design-system-startup-title");
        const message = document.getElementById("design-system-startup-message");
        const reload = document.getElementById("design-system-startup-reload");
        const retry = () => window.location.reload();
        const finished = () => root.childElementCount > 0;
        const cleanup = () => {
          clearTimeout(timer);
          observer.disconnect();
          window.removeEventListener("error", onError, true);
          window.removeEventListener("unhandledrejection", onFailure);
          reload.removeEventListener("click", retry);
          notice.remove();
        };
        const onFailure = () => {
          if (finished()) return cleanup();
          title.textContent = "Design System could not start";
          message.textContent = "Part of the application failed to load. Check your connection and reload this page to try again.";
          notice.hidden = false;
        };
        const onError = (event) => {
          if (event instanceof ErrorEvent || event.target instanceof HTMLScriptElement ||
              (event.target instanceof HTMLLinkElement && event.target.rel === "stylesheet")) onFailure();
        };
        const observer = new MutationObserver(() => { if (finished()) cleanup(); });
        observer.observe(root, { childList: true });
        const timer = setTimeout(() => {
          if (finished()) return cleanup();
          if (!notice.hidden) return;
          title.textContent = "Design System is taking longer to load";
          message.textContent = "You can keep waiting, or reload this page to try again.";
          notice.hidden = false;
        }, 30_000);
        window.addEventListener("error", onError, true);
        window.addEventListener("unhandledrejection", onFailure);
        reload.addEventListener("click", retry);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
