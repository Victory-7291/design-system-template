# Weekly shadcn/ui registry sync — "Dependabot for registry code".
#
# shadcn/ui components are vendored source files (not npm packages), so
# Dependabot cannot track them. This workflow re-injects the tracked
# components from the official registry on a schedule and opens a PR when
# upstream moved — the registry-code equivalent of a Dependabot update PR.
#
# Requires the repo setting "Allow GitHub Actions to create and approve
# pull requests" to be enabled.

name: shadcn sync

on:
  schedule:
    - cron: "0 3 * * 1" # Every Monday 03:00 UTC (11:00 CST)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: shadcn-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Re-inject tracked components (upstream overwrite)
        # The tracked list is the single source of truth for which registry
        # items this project follows. Newly published components are adopted
        # manually: `bunx shadcn@latest add <name> --yes`, then append the
        # name here.
        #
        # bunx (not npx): bun retries transient network failures internally,
        # which npx does not — a single ECONNRESET while fetching the CLI or
        # registry used to fail the whole job (seen 2026-11-02). The loop
        # below adds one more layer of retries for registry-side 5xx bursts.
        run: |
          attempt=1
          until bunx shadcn@latest add $(cat scripts/shadcn-components.txt) --overwrite --yes; do
            if [ "$attempt" -ge 3 ]; then
              echo "::error::shadcn add failed after $attempt attempts"
              exit 1
            fi
            echo "Attempt $attempt failed — retrying in 30s..."
            attempt=$((attempt + 1))
            sleep 30
          done
          # Record the new stock state so check:ui accepts upstream's files
          # (and still rejects hand edits made outside this workflow).
          node scripts/check-ui-stock.mjs --write

      - name: Open sync PR when upstream changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "Registry is already in sync — nothing to do."
            exit 0
          fi
          DATE=$(date +%Y%m%d)
          BRANCH="chore/shadcn-sync-${DATE}"
          git config user.name "shadcn-sync-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A
          git commit -m "chore(ui): sync shadcn/ui registry components"
          git push -f origin "$BRANCH"
          if gh pr view "$BRANCH" >/dev/null 2>&1; then
            echo "Pull request for branch $BRANCH already exists — branch updated."
            exit 0
          fi
          {
            echo "Weekly \`shadcn add --overwrite\` re-injection of the tracked registry components (\`scripts/shadcn-components.txt\`)."
            echo
            echo "## Review notes"
            echo ""
            echo "- \`src/components/ui/\` is upstream-managed and kept in stock form: template-specific surface modes (\`.card-interactive\`, \`.banner-tone\`) live in \`src/index.css\` or \`src/components/*.tsx\`, so \`--overwrite\` requires no manual re-application."
            echo "- New registry items are never auto-added. To adopt one: \`bunx shadcn@latest add <name> --yes\`, then append the name to \`scripts/shadcn-components.txt\`."
          } | gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore(ui): weekly shadcn/ui registry sync (${DATE})" \
            --body-file -
